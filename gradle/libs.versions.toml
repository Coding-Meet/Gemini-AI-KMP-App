android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
composeMultiplatform = "1.12.2"
junit = "4.13.2"
kotlin = "2.4.21"
kotlin-wrappers = "2026.10.4"
kotlinx-coroutines = "1.11.0"
material3 = "1.12.0-alpha03"
ksp = "2.3.6"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
androidx-splashscreen = "1.2.0"

androidx-navigation = "2.10.0"
material3-adaptive = "1.3.0"
material3WindowSizeClass = "1.9.0"
materialIconsExtended = "1.7.3"

ktor = "3.6.0"
room = "2.8.5"
sqlite = "2.7.1"
datastore = "1.3.0"
koin = "4.2.2"
coil3 = "3.6.3"
kermit = "2.2.0"
buildkonfig = "0.23.0"
